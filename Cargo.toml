[workspace]
resolver = "2"
members = [
  "contract",
  "types",
  "tools",
  "tests",
  "tests/caller",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Dusk Forge"]

[workspace.dependencies]
# Dusk / Piecrust toolchain
# NOTE: keep these aligned with the chain toolchain you target.
dusk-core = { version = "1.4.0", default-features = false }
dusk-vm = { version = "1.4.1", default-features = false }
dusk-data-driver = "0.3"
dusk-forge = "0.2.2"
time-core = "=0.1.6"

# Serialization
bytecheck = { version = "0.6.12", default-features = false }
rkyv = { version = "0.7.39", default-features = false, features = [
  "size_32",
  "alloc",
  "validation",
] }

# JSON tooling for the data-driver
serde = { version = "1.0.210", default-features = false }
serde_json = "1.0.128"
serde_with = { version = "3.9", default-features = false }
